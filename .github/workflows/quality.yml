name: Quality and Worker packaging

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:regression
      - run: npm run release:check
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir dist/worker-dry-run
