name: Daily SEO

on:
  schedule:
    - cron: '15 7 * * *'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-seo-production
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      plan: ${{ steps.plan.outputs.plan }}
      deploy_ready: ${{ steps.deployment.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install tsx --test scripts/tests/seo.test.ts
      - id: plan
        name: Run the three SEO skills
        run: npx --no-install tsx scripts/daily-seo.ts plan "$RUNNER_TEMP/daily-seo"
        env:
          SEO_GSC_SERVICE_ACCOUNT: ${{ secrets.SEO_GSC_SERVICE_ACCOUNT }}
          SEO_SERPER_API_KEY: ${{ secrets.SEO_SERPER_API_KEY }}
          SEO_OPENAI_API_KEY: ${{ secrets.SEO_OPENAI_API_KEY }}
      - id: deployment
        if: always()
        name: Check Cloudflare publishing access
        env:
          DEPLOY_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && (vars.CLOUDFLARE_ACCOUNT_ID != '' || secrets.CLOUDFLARE_ACCOUNT_ID != '') }}
        run: |
          echo "ready=$DEPLOY_READY" >> "$GITHUB_OUTPUT"
          if [[ "$DEPLOY_READY" != true ]]; then
            echo "- Publishing blocked until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-seo-report
          path: |
            ${{ runner.temp }}/daily-seo/report.md
            ${{ runner.temp }}/daily-seo/keyword-map.csv
          retention-days: 30

  publish:
    needs: audit
    if: needs.audit.outputs.publish == 'true' && needs.audit.outputs.deploy_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate and apply the planned editorial data
        run: npx --no-install tsx scripts/daily-seo.ts apply "$RUNNER_TEMP/daily-seo"
        env:
          SEO_PUBLISH_PLAN: ${{ needs.audit.outputs.plan }}
      - run: npm run check
      - run: npm run check:data
      - run: npm run test:regression
      - run: npm run test:d1
      - run: npm run test:stripe
      - run: npm run release:check
      - run: npm run build
      - run: npx --no-install wrangler deploy --dry-run --outdir dist/worker-dry-run
      - name: Authenticate the existing Cloudflare deployment
        run: npx --no-install wrangler deployments list > /dev/null
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish the verified change to main
        run: |
          git fetch origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Main advanced during the audit. Rerun against the current main."
            exit 1
          fi
          git add -- shared/seo-editorial.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish daily SEO improvements"
            git push origin HEAD:main
          fi
      - name: Deploy the verified Worker build
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify affected pages on the canonical domain
        run: npx --no-install tsx scripts/daily-seo.ts verify "$RUNNER_TEMP/daily-seo"
